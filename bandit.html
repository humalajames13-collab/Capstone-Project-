<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Missing Link</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .clue-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }
    .clue-badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 500;
      color: #60a5fa;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .action-btns {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="bg-blur blur1"></div>
<div class="bg-blur blur2"></div>

<div class="game-box">
  <h1>🔗 Missing Link</h1>
  <h2 id="score">Score: 0</h2>
  <p>Find the <strong>1 word</strong> that connects all three clues!</p>

  <div class="clue-container">
    <span class="clue-badge" id="clue1">---</span>
    <span class="clue-badge" id="clue2">---</span>
    <span class="clue-badge" id="clue3">---</span>
  </div>

  <input type="text" id="answer" placeholder="Type your guess here...">

  <div class="action-btns">
    <button onclick="checkAnswer()">Submit</button>
    <button onclick="nextPuzzle()">Skip</button>
  </div>

  <p id="result"></p>

  <a href="home.html">
    <button style="margin-top: 20px; background: transparent; border: 1px solid rgba(255,255,255,0.3);">Back Home</button>
  </a>
</div>

<script>
let score = 0;
const puzzles = [
    { clues: ["Apple", "Tree", "Computer"], answer: "macintosh" },
    { clues: ["Water", "Ice", "Steam"], answer: "gas" },
    { clues: ["Bark", "Tail", "Leash"], answer: "dog" },
    { clues: ["Key", "Board", "Mouse"], answer: "computer" },
    { clues: ["Sun", "Beach", "Castle"], answer: "sand" },
    { clues: ["Sheet", "Blanket", "Sleep"], answer: "bed" }
];
let currentPuzzle;

function nextPuzzle() {
    currentPuzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
    document.getElementById("clue1").innerText = currentPuzzle.clues[0];
    document.getElementById("clue2").innerText = currentPuzzle.clues[1];
    document.getElementById("clue3").innerText = currentPuzzle.clues[2];
    document.getElementById("answer").value = "";
    document.getElementById("result").innerHTML = "";
}

function checkAnswer() {
    let userAnswer = document.getElementById("answer").value.toLowerCase().trim();
    if(userAnswer === currentPuzzle.answer) {
        score += 15;
        document.getElementById("result").innerHTML = "🔥 Brilliant! +15 Score";
    } else {
        score = Math.max(0, score - 5);
        document.getElementById("result").innerHTML = `❌ Incorrect! Linked word was: <strong>${currentPuzzle.answer}</strong>`;
    }
    document.getElementById("score").innerHTML = `Score: ${score}`;
    setTimeout(nextPuzzle, 1500);
}

nextPuzzle();
</script>
</body>
</html>
